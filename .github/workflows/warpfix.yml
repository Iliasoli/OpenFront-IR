name: 🛠️ WarpFix CI Hook

on:
  workflow_run:
    workflows:
      - "🧪 CI"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  failed-ci:
    name: WarpFix failure hook
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failed CI run
        run: |
          echo "WarpFix CI hook received a failed run."
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
