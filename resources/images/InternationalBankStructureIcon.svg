  <rect x="14" y="28" width="5" height="20" rx="1" fill="#fff" />
  <rect x="24.5" y="28" width="5" height="20" rx="1" fill="#fff" />
  <rect x="34.5" y="28" width="5" height="20" rx="1" fill="#fff" />
  <rect x="45" y="28" width="5" height="20" rx="1" fill="#fff" />
  <!-- Stepped foundation -->
